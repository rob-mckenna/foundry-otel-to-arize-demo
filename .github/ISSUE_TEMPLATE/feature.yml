name: Change or Architecture Proposal
description: Propose a focused change, infrastructure attachment, mapping improvement or conceptual design.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for changes to the caller, durable pipeline, existing-resource attachment or documentation.

        **Synthetic data only.** No secrets, raw telemetry, connection strings or real healthcare/personal data.
        Architectural expansion requires an accepted decision and explicit implementation approval.
        Conceptual proposals must say **CONCEPTUAL — NOT IMPLEMENTED**; this form grants no live authority.
  - type: dropdown
    id: evidence-status
    attributes:
      label: Evidence / approval boundary
      options:
        - Existing-path change — offline validation only
        - Existing-resource attachment — separate live approval required
        - Architecture decision — implementation approval required
        - CONCEPTUAL — NOT IMPLEMENTED
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What is the feature? Describe the desired behavior/capability.
    validations:
      required: true
  - type: textarea
    id: customer-value
    attributes:
      label: Customer Value
      description: Why does this matter to an enterprise healthcare customer evaluating observability for Foundry Prompt Agents? What does it let them see/prove/validate?
    validations:
      required: true
  - type: dropdown
    id: architecture-track
    attributes:
      label: Architecture Track
      description: Which part of the system does this feature primarily touch?
      options:
        - Architecture
        - Infrastructure
        - PromptAgent
        - ApplicationInsights
        - TelemetryPipeline
        - Arize
        - Documentation
        - Demo
        - FutureState
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues, infrastructure, or decisions this feature depends on. State "None" explicitly if there are none.
    validations:
      required: true
  - type: textarea
    id: telemetry-requirements
    attributes:
      label: Telemetry Requirements
      description: What spans/attributes/trace or correlation IDs/token-usage fields must this feature preserve or emit? State "None" explicitly if not applicable.
    validations:
      required: true
  - type: textarea
    id: security-requirements
    attributes:
      label: Security Requirements
      description: Key Vault usage, managed identity usage, data classification, PII/PHI exposure risk. State "None" explicitly if not applicable.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of conditions that must be true for this feature to be considered done.
    validations:
      required: true
  - type: textarea
    id: demo-validation-steps
    attributes:
      label: Validation and Limitations
      description: Exact offline checks, expected evidence, known limitations and any separately approved live validation. Do not claim deployment or whole-trace/exactly-once proof.
      placeholder: |
        1. Run the relevant offline suites and standalone Bicep compilation
        2. Describe expected identity/content/token preservation and limitations
        3. State live approval still required, or link independently approved scope
    validations:
      required: true
