name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      TMPDIR: ${{ github.workspace }}/.local/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.local/pip-cache
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare local tooling directories
        run: mkdir -p .local/tmp .tools
      - name: Clean-install both exact manifests and Function requirements
        run: python -m pip install -e "./src/prompt-agent[test]" -e "./src/telemetry-pipeline[test]" -r src/telemetry-pipeline/requirements.txt
      - name: Caller offline tests
        run: python -m pytest src/prompt-agent/tests -q
      - name: Durable pipeline, mapping and export tests
        run: python -m pytest src/telemetry-pipeline/tests tests/telemetry-mapping tests/export -q
      - name: Offline bridge preparation
        run: python infra/scripts/prepare-bridge.py --parameters infra/main.parameters.json
      - name: Install standalone Bicep (required, never silently skipped)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 --output .tools/bicep
          chmod +x .tools/bicep
          .tools/bicep --version
          echo "BICEP_CLI=$GITHUB_WORKSPACE/.tools/bicep" >> "$GITHUB_ENV"
      - name: Compile and test attachment and packaging
        run: |
          "$BICEP_CLI" build infra/main.bicep --stdout > .local/main.json
          python -m unittest discover -s infra/scripts -p "test_*.py" -v
      - name: Build immutable Function package from this commit
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install -r src/telemetry-pipeline/requirements.txt --target .release/dependencies --only-binary=:all:
          python infra/scripts/build-function-package.py --source-head "$GITHUB_SHA" --dependencies .release/dependencies --output .release/bridge.zip

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check tracked files for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          # Lightweight guard, not a replacement for full secret scanning.
          pattern='(AccountKey=|InstrumentationKey=|SharedAccessKey=|DefaultEndpointsProtocol=)[A-Za-z0-9+/=_-]+|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          placeholders='<[^>]*>|YOUR_|REPLACE_ME|EXAMPLE|00000000-0000-0000-0000-000000000000|xxxxxxxx'
          matches=$(git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml' || true)
          flagged=$(printf '%s\n' "$matches" | grep -vE "$placeholders" || true)
          if [ -n "$flagged" ]; then
            echo "Potential committed secret detected; review locally without printing its value."
            exit 1
          fi
          echo "No non-placeholder matches found."
