[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-agent"
version = "0.1.0"
description = "Minimal managed-identity caller for an existing exact Foundry agent version."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Squad: Agent (Application / Prompt Agent Developer)" },
]
dependencies = [
    "opentelemetry-api>=1.24.0",
    "azure-ai-projects==2.0.0",
    "azure-identity==1.26.0",
    "openai==2.26.0",
    "azure-core[aio]==1.41.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.scripts]
prompt-agent = "prompt_agent.foundry_responses:main"

[tool.setuptools.packages.find]
include = ["prompt_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
